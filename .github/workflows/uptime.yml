# Is sense.mole.is up? Every half hour (W-16). GitHub emails when a scheduled
# run fails, so nobody has to watch it. Once the backend is deployed, set the
# repository variable HEALTH_URL to its /api/health address (docs/YOUR_TURN.md)
# and this checks that too.
name: Uptime

on:
  # PAUSED 9 Oct: Cloudflare answers GitHub's servers with a challenge (a 403
  # with cf-mitigated: challenge), so every run fails and GitHub emails each
  # failure. It comes back when docs/YOUR_TURN.md step 7c is done and a manual
  # run is green: put the two lines below back.
  #   schedule:
  #     - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site and backend answer
        run: node scripts/uptime.mjs
        env:
          SITE_URL: https://sense.mole.is
          HEALTH_URL: ${{ vars.HEALTH_URL }}
